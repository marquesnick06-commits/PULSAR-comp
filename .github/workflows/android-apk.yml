
name: Build PULSAR APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract project
        run: |
          unzip -q "PULSAR(comp).zip" -d source
          cd "source/PULSAR(comp)"
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd "source/PULSAR(comp)/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSAR-comp-apk
          path: source/PULSAR(comp)/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
